name: Render UML diagrams

on:
  push:
    branches: [main]
    paths:
      - 'docs/uml/*.dot'
      - '.github/workflows/render-uml.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Render UML sources
        run: |
          set -e
          for diagram in usecase activity class; do
            dot -Tpng "docs/uml/${diagram}.dot" -o "docs/uml/${diagram}.png"
            dot -Tsvg "docs/uml/${diagram}.dot" -o "docs/uml/${diagram}.svg"
          done
      - name: Commit rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/uml/*.png docs/uml/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs: render UML diagrams"
            git push
          fi
